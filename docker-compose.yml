services:
  bot-wpp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STORAGE_PROVIDER: supabase
      LOCAL_DOCUMENTS_MIRROR_ENABLED: "false"
      WHATSAPP_SESSION_DIR: /app/auth/whatsapp
      TEMP_DIR: /app/tmp/uploads
      LOCAL_DOCUMENTS_ROOT: /app/docs
    volumes:
      - /opt/effectus-backend/auth:/app/auth
      - /opt/effectus-backend/tmp:/app/tmp
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.effectus-bot-web.rule=Host(`api.effectuscb.com`)
      - traefik.http.routers.effectus-bot-web.entrypoints=web
      - traefik.http.routers.effectus-bot-web.middlewares=redirect-to-https@file
      - traefik.http.routers.effectus-bot-websecure.rule=Host(`api.effectuscb.com`)
      - traefik.http.routers.effectus-bot-websecure.entrypoints=websecure
      - traefik.http.routers.effectus-bot-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.effectus-bot.loadbalancer.server.port=3335
    networks:
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true
