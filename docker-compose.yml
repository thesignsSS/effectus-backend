services:
  bot-wpp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-wpp
    environment:
      NODE_ENV: production
      WHATSAPP_SESSION_DIR: /app/auth/whatsapp
      TEMP_DIR: /app/tmp/uploads
      LOCAL_DOCUMENTS_ROOT: /app/docs
      QR_CODE_WEB_PORT: ${QR_CODE_WEB_PORT}
      FORM_SUBMISSION_HTTP_PORT: ${FORM_SUBMISSION_HTTP_PORT}
    ports:
      - "${QR_CODE_WEB_PORT}:${QR_CODE_WEB_PORT}"
      - "${FORM_SUBMISSION_HTTP_PORT}:${FORM_SUBMISSION_HTTP_PORT}"
    volumes:
      - ./auth:/app/auth
      - ./tmp:/app/tmp
