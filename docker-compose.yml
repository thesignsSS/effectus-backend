services:
  bot-wpp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-wpp
    environment:
      NODE_ENV: production
      WHATSAPP_SESSION_DIR: /app/auth/whatsapp
      TEMP_DIR: /app/tmp/uploads
      LOCAL_DOCUMENTS_ROOT: /app/docs
    ports:
      - "${QR_CODE_WEB_PORT}:3335"
      - "${FORM_SUBMISSION_HTTP_PORT}:3334"
    volumes:
      - ./auth:/app/auth
      - ./tmp:/app/tmp
