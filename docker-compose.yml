services:
  bot-wpp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-wpp
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STORAGE_PROVIDER: supabase
      LOCAL_DOCUMENTS_MIRROR_ENABLED: "false"
      WHATSAPP_SESSION_DIR: /app/auth/whatsapp
      TEMP_DIR: /app/tmp/uploads
      LOCAL_DOCUMENTS_ROOT: /app/docs
    ports:
      - "${QR_CODE_WEB_PORT:-3334}:3334"
      - "${FORM_SUBMISSION_HTTP_PORT:-3335}:3335"
    volumes:
      - ./auth:/app/auth
      - ./tmp:/app/tmp
